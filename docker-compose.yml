# 로컬 개발용 DB. 값은 저장소 루트의 .env에서 읽는다 (.env.example 참고).
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: umatgong-db
    environment:
      POSTGRES_DB: ${DB_NAME:-umatgong}
      POSTGRES_USER: ${DB_USERNAME:-umatgong}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    ports:
      - "5432:5432"
    volumes:
      - umatgong-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  umatgong-db:
