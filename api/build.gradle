plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.umatgong'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// OpenFeign 포크: 원본 com.querydsl 5.x는 유지보수가 멈췄고 CVE-2024-49203이 열려 있다.
	// 6.x 라인이 Boot 3.5의 Hibernate 6.6 / JPA 3.1과 맞는다 (7.x는 Hibernate 7 대상).
	querydslVersion = '6.12'
	jjwtVersion = '0.13.0'
	// Boot가 kotlin-stdlib를 1.9로 내려 OkHttp 5(mockwebserver3, 테스트 전용)가 깨지지 않게 올려 둔다.
	set('kotlin.version', '2.1.21')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 카카오 장소 검색 결과 캐시 (버전은 Boot가 관리)
	implementation 'com.github.ben-manes.caffeine:caffeine'

	runtimeOnly 'org.postgresql:postgresql'
	// JTS Point <-> PostGIS geography 매핑
	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 카카오 API를 실제로 부르지 않고 로컬 HTTP 서버로 흉내 낸다. Boot가 버전을 관리하지 않아 직접 고정한다.
	testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ./gradlew bootRun 은 기본으로 local 프로필로 뜬다. 다른 프로필은 SPRING_PROFILES_ACTIVE로 지정.
// bootRun에만 걸리므로 배포용 jar(bootJar)에는 영향이 없다.
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

// 배포 플랫폼(Railway)의 시작 명령을 버전과 무관하게 고정하기 위해 실행 jar 이름을 app.jar로 둔다.
//   java $JAVA_OPTS -jar build/libs/app.jar
// 실행할 수 없는 -plain.jar는 만들지 않는다. 있으면 build/libs/*.jar 같은 패턴이 그것을 집을 수 있다.
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}
