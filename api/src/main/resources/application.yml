# 공통 설정. 이 파일은 커밋한다. 단 실제 값은 절대 넣지 않고 ${환경변수} 자리만 둔다.
# (JWT 시크릿·DB 비밀번호·카카오 키 등. ApplicationConfigTest가 이를 검사한다)
#
# 설정이 적용되는 순서 (뒤가 이긴다)
#   1. application.yml          — 이 파일. 공통 구조
#   2. application-local.yml    — 로컬 개발값 (local 프로필, 커밋하지 않음)
#   3. 환경변수                  — 배포 환경. 모든 ${...} 자리를 덮어쓴다
#
# 배포 시 필요한 환경변수
#   PORT                          — Railway 등 플랫폼이 넣어 준다. 없으면 8080
#   DB_URL                        — jdbc:postgresql://호스트:포트/DB 형식 (postgresql:// 형식은 안 됨)
#   DB_USERNAME, DB_PASSWORD
#   JWT_SECRET                    — 32바이트(256비트) 이상. 예: openssl rand -base64 64
#   JWT_ACCESS_TOKEN_VALIDITY     — 초 단위 (기본 1800)
#   JWT_REFRESH_TOKEN_VALIDITY    — 초 단위 (기본 1209600 = 14일)
#   KAKAO_REST_API_KEY            — 장소 검색(로컬 API)용. 없으면 기동하지 않는다
#   KAKAO_APP_ID                  — 카카오 개발자 콘솔 [앱 설정 > 앱 키]의 앱 ID. 없으면 기동하지 않는다
#   KAKAO_CLIENT_SECRET           — 카카오 앱에서 Client Secret을 켰을 때만. 웹 로그인 코드 교환에 쓴다
#   KAKAO_ALLOWED_REDIRECT_URIS   — 웹 로그인 콜백 주소 허용 목록, 쉼표로 여러 개.
#                                   카카오 콘솔의 Redirect URI와 같은 값. 예: https://umatgong.app/auth/kakao/callback
#   CORS_ALLOWED_ORIGINS          — 쉼표로 여러 개
#   PLAN_*                        — 요금제 제한값. 없으면 기획서 9장 값을 쓴다 (아래 umatgong.plan)
#   SUPABASE_URL                  — 사진(썸네일) 저장소. 예: https://abcd.supabase.co. 비우면 사진 업로드만 꺼진다
#   SUPABASE_SERVICE_KEY          — Supabase service_role 키. 서버 전용, 절대 프론트로 내보내지 않는다
#   SUPABASE_PHOTO_BUCKET         — 공개(public) 버킷 이름. 기본 thumbnails
#   APP_DEV_SEED_ENABLED          — 개발용 시드 API(POST /api/dev/seed). 기본 false. **운영에서는 켜지 않는다**
#   APP_DEV_SEED_TOKEN            — 시드 API 헤더(X-Dev-Seed-Token)로 받을 시크릿. 32자 이상.
#                                   예: openssl rand -base64 32

server:
  # 배포 플랫폼(Railway 등)은 PORT로 포트를 정해 준다. 그 포트로 떠야 요청이 들어온다.
  port: ${PORT:8080}

spring:
  application:
    name: umatgong-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/umatgong}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 어긋나는지 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 썸네일만 받는다. 실제 한도는 umatgong.photo.max-bytes가 정하고, 이 값은 그보다 넉넉한 안전판이다
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

umatgong:
  jwt:
    # 비어 있으면 기동 시 WeakKeyException으로 실패한다. 의도된 동작.
    secret: ${JWT_SECRET:}
    # 단위 없는 숫자는 초
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1800}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600}
  cors:
    # Expo 웹 개발 서버 기본 포트가 8081이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
    allow-credentials: false
  kakao:
    # 장소 검색(로컬 API)과 웹 로그인 코드 교환에 쓴다. 비어 있으면 기동 시 실패한다.
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 웹 로그인 redirectUri 허용 목록. 목록에 없는 값은 카카오를 부르지 않고 거부한다 (오픈 리다이렉트 방지).
    # 문자열이 정확히 같아야 한다. 기본값은 Expo 웹 개발 서버의 콜백 경로다.
    allowed-redirect-uris: ${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:8081/auth/kakao/callback}
    # 로그인 토큰이 우리 앱에서 발급된 것인지 확인한다. 비어 있으면 기동 시 실패한다.
    app-id: ${KAKAO_APP_ID:}
  # 요금제 제한값 (기획서 9장). 코드에 숫자를 두지 않는다. 과금은 아직 켜지 않았다.
  plan:
    free:
      # 다 차면 새 초대·합류만 막는다. 기존 멤버는 그대로 쓴다.
      max-club-members: ${PLAN_FREE_MAX_CLUB_MEMBERS:8}
      max-clubs-per-user: ${PLAN_FREE_MAX_CLUBS_PER_USER:1}
    paid:
      max-club-members: ${PLAN_PAID_MAX_CLUB_MEMBERS:30}
      max-clubs-per-user: ${PLAN_PAID_MAX_CLUBS_PER_USER:3}
  # 개발 전용 시드 API. 꺼져 있거나 토큰이 틀리면 없는 경로와 같은 404를 돌려준다.
  dev:
    seed:
      enabled: ${APP_DEV_SEED_ENABLED:false}
      token: ${APP_DEV_SEED_TOKEN:}
  # 기록 사진(썸네일). 원본은 받지 않는다 (긴 변 max-dimension px 이하만)
  photo:
    supabase-url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_PHOTO_BUCKET:thumbnails}
    max-bytes: ${PHOTO_MAX_BYTES:524288}
    max-dimension: ${PHOTO_MAX_DIMENSION:800}
