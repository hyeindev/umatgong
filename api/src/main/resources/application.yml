# 공통 설정. 이 파일은 커밋한다. 단 실제 값은 절대 넣지 않고 ${환경변수} 자리만 둔다.
# (JWT 시크릿·DB 비밀번호·카카오 키 등. ApplicationConfigTest가 이를 검사한다)
#
# 설정이 적용되는 순서 (뒤가 이긴다)
#   1. application.yml          — 이 파일. 공통 구조
#   2. application-local.yml    — 로컬 개발값 (local 프로필, 커밋하지 않음)
#   3. 환경변수                  — 배포 환경. 모든 ${...} 자리를 덮어쓴다
#
# 배포 시 필요한 환경변수
#   PORT                          — Railway 등 플랫폼이 넣어 준다. 없으면 8080
#   DB_URL                        — jdbc:postgresql://호스트:포트/DB 형식 (postgresql:// 형식은 안 됨)
#   DB_USERNAME, DB_PASSWORD
#   JWT_SECRET                    — 32바이트(256비트) 이상. 예: openssl rand -base64 64
#   JWT_ACCESS_TOKEN_VALIDITY     — 초 단위 (기본 1800)
#   JWT_REFRESH_TOKEN_VALIDITY    — 초 단위 (기본 1209600 = 14일)
#   KAKAO_REST_API_KEY            — 장소 검색(로컬 API)용. 없으면 기동하지 않는다
#   KAKAO_APP_ID                  — 카카오 개발자 콘솔 [앱 설정 > 앱 키]의 앱 ID. 없으면 기동하지 않는다
#   CORS_ALLOWED_ORIGINS          — 쉼표로 여러 개

server:
  # 배포 플랫폼(Railway 등)은 PORT로 포트를 정해 준다. 그 포트로 떠야 요청이 들어온다.
  port: ${PORT:8080}

spring:
  application:
    name: umatgong-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/umatgong}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. Hibernate는 엔티티와 어긋나는지 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

umatgong:
  jwt:
    # 비어 있으면 기동 시 WeakKeyException으로 실패한다. 의도된 동작.
    secret: ${JWT_SECRET:}
    # 단위 없는 숫자는 초
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1800}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:1209600}
  cors:
    # Expo 웹 개발 서버 기본 포트가 8081이다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
    allow-credentials: false
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    # 로그인 토큰이 우리 앱에서 발급된 것인지 확인한다. 비어 있으면 기동 시 실패한다.
    app-id: ${KAKAO_APP_ID:}
