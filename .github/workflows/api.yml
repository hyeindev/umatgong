name: api

# 로컬에서 서버를 띄울 수 없으므로 이 워크플로가 유일한 실행 검증이다.
# 실제 PostGIS에 Flyway를 적용하고 전체 Spring 컨텍스트(스키마 검증 포함)를 띄운다.

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: api

    services:
      postgres:
        # docker-compose.yml과 같은 이미지
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: umatgong
          POSTGRES_USER: umatgong
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umatgong -d umatgong"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # 전부 CI 전용 더미값이다. 테스트는 실제 카카오를 호출하지 않으므로 진짜 키가 필요 없다.
    env:
      # 통합 테스트는 테이블을 비운다(TRUNCATE). 이 값이 true이고 DB가 localhost일 때만 돈다.
      # 배포 플랫폼 빌드에서 운영 DB로 통합 테스트가 도는 사고를 막기 위해서다.
      CI_INTEGRATION_DB: 'true'
      DB_URL: jdbc:postgresql://localhost:5432/umatgong
      DB_USERNAME: umatgong
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-else-0123456789abcdef
      KAKAO_REST_API_KEY: ci-dummy
      KAKAO_APP_ID: '1'
      PGPASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시. 래퍼 jar 검증도 함께 한다.
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build

      # CI_INTEGRATION_DB 설정이 빠지면 통합 테스트가 조용히 건너뛰어져도 초록불이 된다. 그걸 막는다.
      - name: Check integration tests actually ran
        run: |
          python3 - <<'PY'
          import glob, re, sys
          files = glob.glob("build/test-results/test/TEST-com.umatgong.integration.*.xml")
          if not files:
              sys.exit("::error::통합 테스트 결과가 없습니다")
          total = skipped = 0
          for f in files:
              head = open(f, encoding="utf-8").read(2000)
              total += int(re.search(r'tests="(\d+)"', head).group(1))
              skipped += int(re.search(r'skipped="(\d+)"', head).group(1))
          print(f"integration tests: {total}, skipped: {skipped}")
          if total == 0 or skipped:
              sys.exit("::error::통합 테스트가 실행되지 않았습니다 (CI_INTEGRATION_DB 확인)")
          PY

      # 테스트는 롤백되지만 Flyway 적용은 커밋된다. 파일 수만큼 성공 기록이 있는지 DB에서 직접 본다.
      - name: Verify Flyway migrations applied
        run: |
          expected=$(ls src/main/resources/db/migration/V*__*.sql | wc -l)
          applied=$(psql -h localhost -U umatgong -d umatgong -tAc \
            "select count(*) from flyway_schema_history where success and version is not null")
          psql -h localhost -U umatgong -d umatgong -c \
            "select version, description, success, installed_on from flyway_schema_history order by installed_rank"
          echo "migration files: $expected, applied: $applied"
          if [ "$applied" -ne "$expected" ]; then
            echo "::error::Flyway 적용 수($applied)가 마이그레이션 파일 수($expected)와 다릅니다"
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api/build/reports/tests/test
          retention-days: 7
